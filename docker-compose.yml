services:
  postgres:
    image: postgres:15-alpine
    container_name: zuhee-gw-db
    environment:
      POSTGRES_DB: zuhee_gw
      POSTGRES_USER: zuhee
      POSTGRES_PASSWORD: password123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
